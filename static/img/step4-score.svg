e cx="388" cy="132" r="52" fill="none" stroke="#ff4d6d" stroke-width="14" stroke-linecap="round" stroke-dasharray="287.5 326.7" transform="rotate(-90 388 132)"/><text x="388" y="142" font-size="32" fill="#eef2ff" font-weight="700" text-anchor="middle" font-family="Poppins,Arial,sans-serif">88</text><text x="388" y="216" font-size="15" fill="#ff4d6d" font-weight="700" text-anchor="middle" font-family="Poppins,Arial,sans-serif">Malicious</text><text x="388" y="236" font-size="11" fill="#8b94b0" font-weight="500" text-anchor="middle" font-family="Poppins,Arial,sans-serif">70 or higher</text><text x="24" y="262" font-size="12" fill="#eef2ff" font-weight="600" text-anchor="start" font-family="Poppins,Arial,sans-serif">risk = 1 − (1 − 0.55)(1 − 0.45)(1 − 0.50) = 0.88</text><text x="24" y="282" font-size="11" fill="#8b94b0" font-weight="500" text-anchor="start" font-family="Poppins,Arial,sans-serif">Weak signals add up, one strong signal dominates, 100 is the cap</text></svg>