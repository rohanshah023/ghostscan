<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="Validation checks on extension, size, real file type and name, then analysis in an isolated process with limits"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5cffc8"/></marker></defs><rect x="0.5" y="0.5" width="519" height="299" rx="14" fill="#0e1118" stroke="#2a3348" /><rect x="24" y="44" width="282" height="38" rx="8" fill="#151a26" stroke="#5cffc8" /><text x="38" y="61" font-size="12" fill="#8b94b0" font-weight="500" text-anchor="start" font-family="Poppins,Arial,sans-serif">Extension allowed</text><text x="38" y="76" font-size="12" fill="#eef2ff" font-weight="600" text-anchor="start" font-family="Poppins,Arial,sans-serif">.pdf</text><circle cx="284" cy="63" r="11" fill="#5cffc8"/><text x="284" y="68" font-size="14" fill="#06130d" font-weight="700" text-anchor="middle" font-family="Poppins,Arial,sans-serif">✓</text><rect x="24" y="94" width="282" height="38" rx="8" fill="#151a26" stroke="#5cffc8" /><text x="38" y="111" font-size="12" fill="#8b94b0" font-weight="500" text-anchor="start" font-family="Poppins,Arial,sans-serif">Size under the limit</text><text x="38" y="126" font-size="12" fill="#eef2ff" font-weight="600" text-anchor="start" font-family="Poppins,Arial,sans-serif">2.1 MB</text><circle cx="284" cy="113" r="11" fill="#5cffc8"/><text x="284" y="118" font-size="14" fill="#06130d" font-weight="700" text-anchor="middle" font-family="Poppins,Arial,sans-serif">✓</text><rect x="24" y="144" width="282" height="38" rx="8" fill="#151a26" stroke="#5cffc8" /><text x="38" y="161" font-size="12" fill="#8b94b0" font-weight="500" text-anchor="start" font-family="Poppins,Arial,sans-serif">Real type (magic bytes)</text><text x="38" y="176" font-size="12" fill="#eef2ff" font-weight="600" text-anchor="start" font-family="Poppins,Arial,sans-serif">%PDF-</text><circle cx="284" cy="163" r="11" fill="#5cffc8"/><text x="284" y="168" font-size="14" fill="#06130d" font-weight="700" text-anchor="middle" font-family="Poppins,Arial,sans-serif">✓</text><rect x="24" y="194" width="282" height="38" rx="8" fill="#151a26" stroke="#ff4d6d" /><text x="38" y="211" font-size="12" fill="#8b94b0" font-weight="500" text-anchor="start" font-family="Poppins,Arial,sans-serif">File name</text><text x="38" y="226" font-size="12" fill="#ff4d6d" font-weight="600" text-anchor="start" font-family="Poppins,Arial,sans-serif">invoice.pdf.exe  double extension</text><circle cx="284" cy="213" r="11" fill="#ff4d6d"/><text x="284" y="218" font-size="14" fill="#06130d" font-weight="700" text-anchor="middle" font-family="Poppins,Arial,sans-serif">✗</text><text x="24" y="262" font-size="12" fill="#8b94b0" font-weight="500" text-anchor="start" font-family="Poppins,Arial,sans-serif">Hashes calculated: SHA-256, SHA-1, MD5</text><rect x="326" y="36" width="172" height="228" rx="12" fill="none" stroke="#5cffc8" stroke-width="2" stroke-dasharray="6 5"/><text x="412" y="62" font-size="13" fill="#eef2ff" font-weight="700" text-anchor="middle" font-family="Poppins,Arial,sans-serif">Isolated process</text><rect x="342" y="76" width="140" height="34" rx="8" fill="#151a26" stroke="#2a3348" /><text x="412" y="98" font-size="12" fill="#eef2ff" font-weight="500" text-anchor="middle" font-family="Poppins,Arial,sans-serif">CPU time limit</text><rect x="342" y="120" width="140" height="34" rx="8" fill="#151a26" stroke="#2a3348" /><text x="412" y="142" font-size="12" fill="#eef2ff" font-weight="500" text-anchor="middle" font-family="Poppins,Arial,sans-serif">Memory limit</text><rect x="342" y="164" width="140" height="34" rx="8" fill="#151a26" stroke="#2a3348" /><text x="412" y="186" font-size="12" fill="#eef2ff" font-weight="500" text-anchor="middle" font-family="Poppins,Arial,sans-serif">No file writing</text><rect x="342" y="208" width="140" height="34" rx="8" fill="#151a26" stroke="#2a3348" /><text x="412" y="230" font-size="12" fill="#eef2ff" font-weight="500" text-anchor="middle" font-family="Poppins,Arial,sans-serif">Time-out</text></svg>