<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" role="img" aria-label="A file or a link goes into GhostScan, which reads it as data and never opens or runs it"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5cffc8"/></marker></defs><rect x="0.5" y="0.5" width="519" height="299" rx="14" fill="#0e1118" stroke="#2a3348" /><path d="M40,62 q0,-6 6,-6 h30 l20,20 v46 q0,6 -6,6 h-44 q-6,0 -6,-6z" fill="#151a26" stroke="#5cffc8" stroke-width="2"/><path d="M76,56 v20 h20" fill="none" stroke="#5cffc8" stroke-width="2"/><line x1="50" y1="90" x2="84" y2="90" stroke="#8b94b0" stroke-width="2"/><line x1="50" y1="100" x2="84" y2="100" stroke="#8b94b0" stroke-width="2"/><line x1="50" y1="110" x2="84" y2="110" stroke="#8b94b0" stroke-width="2"/><text x="68" y="158" font-size="13" fill="#eef2ff" font-weight="600" text-anchor="middle" font-family="Poppins,Arial,sans-serif">File</text><rect x="34" y="196" width="36" height="20" rx="10" fill="none" stroke="#a78bfa" /><rect x="56" y="196" width="36" height="20" rx="10" fill="none" stroke="#a78bfa" /><text x="63" y="242" font-size="13" fill="#eef2ff" font-weight="600" text-anchor="middle" font-family="Poppins,Arial,sans-serif">Link</text><line x1="112" y1="100" x2="196" y2="138" stroke="#5cffc8" stroke-width="2" marker-end="url(#a)"/><line x1="112" y1="208" x2="196" y2="166" stroke="#5cffc8" stroke-width="2" marker-end="url(#a)"/><rect x="198" y="96" width="150" height="110" rx="12" fill="#151a26" stroke="#a78bfa" /><text x="273" y="138" font-size="17" fill="#eef2ff" font-weight="700" text-anchor="middle" font-family="Poppins,Arial,sans-serif">GhostScan</text><text x="273" y="162" font-size="12" fill="#8b94b0" font-weight="500" text-anchor="middle" font-family="Poppins,Arial,sans-serif">reads the bytes</text><text x="273" y="180" font-size="12" fill="#8b94b0" font-weight="500" text-anchor="middle" font-family="Poppins,Arial,sans-serif">as plain data</text><line x1="350" y1="150" x2="400" y2="150" stroke="#5cffc8" stroke-width="2" marker-end="url(#a)"/><circle cx="452" cy="150" r="34" fill="none" stroke="#ff4d6d" stroke-width="4"/><path d="M443,134 L469,150 L443,166Z" fill="#8b94b0"/><line x1="428" y1="174" x2="476" y2="126" stroke="#ff4d6d" stroke-width="4"/><text x="452" y="210" font-size="12" fill="#8b94b0" font-weight="500" text-anchor="middle" font-family="Poppins,Arial,sans-serif">Never opened,</text><text x="452" y="228" font-size="12" fill="#8b94b0" font-weight="500" text-anchor="middle" font-family="Poppins,Arial,sans-serif">never run</text></svg>