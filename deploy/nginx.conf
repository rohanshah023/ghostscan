# Reverse proxy in front of gunicorn (put in /etc/nginx/conf.d/ghostscan.conf).
# Terminates TLS, compresses, and rate-limits at the edge so abusive clients never reach Python.
limit_req_zone $binary_remote_addr zone=ghost_api:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=ghost_conn:10m;

server {
    listen 80;
    server_name example.com;                     # <- your domain
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;                     # <- your domain
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 11m;                    # a little above GHOSTSCAN_MAX_BYTES
    client_body_timeout 30s;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml; gzip_min_length 1024;
    limit_conn ghost_conn 20;

    location /static/ {
        alias /app/static/;
        expires 1d;
        add_header Cache-Control "public";
    }
    location /api/ {
        limit_req zone=ghost_api burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 95s;                  # a little above gunicorn's 90 s
        proxy_request_buffering on;
        include /etc/nginx/proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;         # sets Host and X-Forwarded-For/Proto (needs GHOSTSCAN_TRUST_PROXY=1)
    }
}
